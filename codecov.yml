# Codecov configuration: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Relative to the previous commit's coverage; allow 1% drift so small
        # diffs don't flake CI.
        target: auto
        threshold: 1%
    patch:
      default:
        # New lines must be mostly covered, but defensive panic branches and
        # fixed-arity paths (e.g. "must wrap a mock call", len mismatch) are
        # not worth forcing to 100%.
        target: 90%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

# Runnable demos carry no tests; keep them out of the coverage gate.
ignore:
  - "examples/"
