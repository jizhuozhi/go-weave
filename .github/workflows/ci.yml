name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Latest Go across platforms: formatting, vet, tests, race, GC stress.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64, linux/arm64, darwin/arm64.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        # unsafeptr is off by design: the register plumbing converts between
        # uintptr and unsafe.Pointer on purpose.
        run: go vet -unsafeptr=false ./...
      - name: test
        run: go test ./...
      - name: test -race
        run: go test -race ./...
      - name: GC stress
        run: GODEBUG=clobberfree=1 go test -count=3 ./...

  # The runtime.moduledata layout the JIT forges changed in Go 1.23, so that is
  # the floor; this matrix guards the floor and the latest release across both
  # linux architectures.
  versions:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: test
        run: go test ./...
      - name: test -race
        run: go test -race ./...
      - name: GC stress
        run: GODEBUG=clobberfree=1 go test -count=1 ./...
