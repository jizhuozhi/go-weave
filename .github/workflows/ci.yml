name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Latest Go across platforms: formatting, vet, tests, race, GC stress.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64, linux/arm64, darwin/arm64, darwin/amd64 (Intel).
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        # unsafeptr is off by design: the register plumbing converts between
        # uintptr and unsafe.Pointer on purpose.
        run: go vet -unsafeptr=false ./...
      - name: test
        run: go test ./...
      - name: test -race
        run: go test -race ./...
      - name: GC stress
        run: GODEBUG=clobberfree=1 go test -count=3 ./...

  # The runtime.moduledata layout the JIT forges changed a few times (covctrs in
  # 1.20, inittasks in 1.21, bad moved in 1.23, epclntab in 1.26, typelinks/
  # itablinks removed in 1.27). Each segment has its own mirror, and this matrix
  # guards every minor version from the floor to the latest across both linux
  # architectures plus darwin/arm64 — the latter exercises the MAP_JIT cgo shim
  # (internal/rt) against every toolchain, not just the latest.
  versions:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.18", "1.19", "1.20", "1.21", "1.22", "1.23", "1.24", "1.25", "1.26", "1.27"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: test
        run: go test ./...
      - name: test -race
        run: go test -race ./...
      - name: GC stress
        run: GODEBUG=clobberfree=1 go test -count=1 ./...
